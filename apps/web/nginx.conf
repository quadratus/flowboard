server {
  listen 80;
  root /usr/share/nginx/html;

  # Off by default. 40-basic-auth.sh changes this to the password file
  # when BASIC_AUTH_USER and BASIC_AUTH_PASSWORD are set.
  auth_basic off;
  auth_basic_user_file /etc/nginx/htpasswd;

  # Open health check for the host, outside the password barrier.
  location = /healthz {
    auth_basic off;
    access_log off;
    return 200 "ok\n";
  }

  # Same-origin API calls, so the browser never needs CORS.
  # The browser sends the basic-auth credentials with these calls too.
  location /v1/ {
    proxy_pass http://api:3000;
  }

  location / {
    try_files $uri /index.html;
  }
}
